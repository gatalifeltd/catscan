name: Bug report
description: catscan crashed, refused to run or gave a wrong verdict.
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: The exact command or API call.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npx -y @catscan/cli doctor --json`
      render: json
    validations:
      required: true
  - type: textarea
    id: image
    attributes:
      label: Image (optional)
      description: Only a synthetic or shareable image. Never attach a screenshot you are not allowed to publish.
