# catscan on CircleCI (community-tested: no recorded run yet; docs/recipes/ci.md). Add the job to .circleci/config.yml
# and replace:
#   1. `npm ci && npm run screenshots`: the step that makes your screenshots;
#   2. `shots`: the folder they land in, as shots/<locale>/<screen>.png;
#   3. `checks.yaml` (per-screen checks, docs/cli.md) and `locales` (your string catalogs, which name the locales).
# First green run without expectations: npx @catscan/cli@1.0.3 check shots --present "<text every screen shows>" --junit catscan.xml
# catscan needs Node 22 or newer on an Apple silicon Mac. The reports hold your screenshots' text: keep them short-lived.
version: 2.1
jobs:
  catscan:
    macos:
      xcode: "26.6.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run: node --version
      - run: npm ci && npm run screenshots
      # Only if you ship a locale catscan reads with Tesseract, such as el, he, hr or et (catscan languages lists them; the doctor line fails with the install command until this runs; install options: https://github.com/gatalifeltd/catscan/blob/main/docs/recipes/tesseract.md):
      # - run: brew install tesseract tesseract-lang
      - run: npx @catscan/cli@1.0.3 doctor --expect-locales-from locales
      - run: mkdir -p reports && npx @catscan/cli@1.0.3 check shots --expect checks.yaml --expect-locales-from locales --junit reports/catscan.xml --results reports/catscan-results.json
      - store_test_results:
          path: reports
      - store_artifacts:
          path: reports
workflows:
  screens:
    jobs: [catscan]
