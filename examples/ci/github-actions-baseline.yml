# catscan changed-only review on GitHub Actions (community-tested: no recorded run yet; docs/recipes/ci.md#changed-only-review).
# Copy to .github/workflows/catscan-baseline.yml and replace:
#   1. `npm ci && npm run screenshots`: the step that makes your screenshots;
#   2. `shots`: the folder they land in, as shots/<locale>/<screen>.png;
#   3. `checks.yaml` (per-screen checks, docs/cli.md) and `locales` (your string catalogs, which name the locales).
# First green run without expectations: npx @catscan/cli@1.0.0 check shots --present "<text every screen shows>" --format github --baseline catscan-baseline.json
# Pushing a release tag is the approval: tag only a build whose screens were reviewed. The tag job stores the
# approved baseline as an asset of that tag's release; pull requests fetch the newest release that has one.
# The tag job approves the run it makes on the tag commit: tag a commit whose pull-request run was reviewed, with no
# screen change merged after it. The baseline is only as trusted as its store: protect v* tags and keep the default
# workflow token read-only, so only the tag job can write a release asset.
# Retention: a release asset never expires, but in a public repository anyone can download it, and the baseline holds
# your screen text: use this file in a private repository only. GitHub artifacts expire (90 days by default).
# Tesseract: add this step to both jobs, before doctor.
# Only if you ship a locale catscan reads with Tesseract, such as el, he, hr or et (catscan languages lists them; the doctor line fails with the install command until this runs; install options: https://github.com/gatalifeltd/catscan/blob/main/docs/recipes/tesseract.md):
# - run: brew install tesseract tesseract-lang
name: catscan-baseline
on:
  pull_request:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26.13.0 }
      - run: npm ci && npm run screenshots
      - run: npx @catscan/cli@1.0.0 doctor --expect-locales-from locales
      # The newest release with an approved baseline. Before the first approval there is none: catscan warns
      # baseline-missing and every cell is new. A failed lookup fails the job instead of comparing with nothing.
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(any(.assets[]; .name == "catscan-baseline.json"))][0].tag_name // empty')
          if [ -n "$TAG" ]; then gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern catscan-baseline.json --clobber; else echo "no approved baseline yet"; fi
      - run: npx @catscan/cli@1.0.0 check shots --expect checks.yaml --expect-locales-from locales --format github --results catscan-results.json --report catscan.html --baseline catscan-baseline.json
      # Optional: stop the job while any cell needs review (exit codes, annotations and JUnit carry no baseline result).
      # - run: jq -e '.baseline.review.cells == 0' catscan-results.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: catscan, path: "catscan-results.json\ncatscan.html", retention-days: 7 }
  approve:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write # uploads the approved baseline to the tag's release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26.13.0 }
      - run: npm ci && npm run screenshots
      - run: npx @catscan/cli@1.0.0 doctor --expect-locales-from locales
      - run: npx @catscan/cli@1.0.0 check shots --expect checks.yaml --expect-locales-from locales --format github --results catscan-results.json
      # Refuses (exit 1) a run with error, needs-reader, unsupported, missing or ambiguous cells: fix them and tag again.
      - run: npx @catscan/cli@1.0.0 results baseline catscan-results.json --out catscan-baseline.json
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --notes ""
          gh release upload "$GITHUB_REF_NAME" catscan-baseline.json --repo "$GITHUB_REPOSITORY" --clobber
