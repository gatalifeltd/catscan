# catscan on GitLab CI hosted macOS runners (community-tested: no recorded run yet; docs/recipes/ci.md).
# Add this job to .gitlab-ci.yml and replace:
#   1. `npm ci && npm run screenshots`: the step that makes your screenshots;
#   2. `shots`: the folder they land in, as shots/<locale>/<screen>.png;
#   3. `checks.yaml` (per-screen checks, docs/cli.md) and `locales` (your string catalogs, which name the locales).
# First green run without expectations: npx @catscan/cli@1.0.1 check shots --present "<text every screen shows>" --junit catscan.xml
# catscan needs Node 22 or newer; the recipe names the image's Node and how to install a newer one.
# The artifacts hold your screenshots and their text (catscan.html, docs/report.md): anyone with read access to the
# project can download them.
catscan:
  tags: [saas-macos-medium-m1]
  image: macos-15-xcode-16
  stage: test
  script:
    - node --version
    - npm ci && npm run screenshots
    # Only if you ship a locale catscan reads with Tesseract, such as el, he, hr or et (catscan languages lists them; the doctor line fails with the install command until this runs; install options: https://github.com/gatalifeltd/catscan/blob/main/docs/recipes/tesseract.md):
    # - brew install tesseract tesseract-lang
    - npx @catscan/cli@1.0.1 doctor --expect-locales-from locales
    # Thresholds (docs/cli.md#severity-and-certainty): only findings at or above both levels fail the job; default: every finding. On a finding command: --min-severity major --min-certainty medium
    - npx @catscan/cli@1.0.1 check shots --expect checks.yaml --expect-locales-from locales --junit catscan.xml --gitlab-codequality catscan-cq.json --results catscan-results.json --report catscan.html
  artifacts:
    when: always
    expire_in: 7 days
    paths: [catscan-results.json, catscan.xml, catscan-cq.json, catscan.html]
    reports:
      junit: catscan.xml
      codequality: catscan-cq.json
