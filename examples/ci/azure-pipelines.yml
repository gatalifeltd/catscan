# catscan on Azure Pipelines (community-tested: no recorded run yet; docs/recipes/ci.md).
# Microsoft-hosted macOS images are Intel, which catscan does not support (the arm64 preview is paused), so this runs
# on a self-hosted Apple silicon agent in the pool you name. Replace:
#   1. `npm ci && npm run screenshots`: the step that makes your screenshots;
#   2. `shots`: the folder they land in, as shots/<locale>/<screen>.png;
#   3. `checks.yaml` (per-screen checks, docs/cli.md) and `locales` (your string catalogs, which name the locales).
# First green run without expectations: npx @catscan/cli@1.0.3 check shots --present "<text every screen shows>" --junit catscan.xml
# catscan needs Node 22 or newer on an Apple silicon Mac. The reports hold your screenshots' text: keep them short-lived.
trigger: none
pr: [main]
pool:
  name: apple-silicon
steps:
  - checkout: self
    persistCredentials: false
  - script: node --version
  - script: npm ci && npm run screenshots
  # Only if you ship a locale catscan reads with Tesseract, such as el, he, hr or et (catscan languages lists them; the doctor line fails with the install command until this runs; install options: https://github.com/gatalifeltd/catscan/blob/main/docs/recipes/tesseract.md):
  # - script: brew install tesseract tesseract-lang
  - script: npx @catscan/cli@1.0.3 doctor --expect-locales-from locales
  - script: npx @catscan/cli@1.0.3 check shots --expect checks.yaml --expect-locales-from locales --junit catscan.xml --results catscan-results.json
  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: catscan.xml
      testRunTitle: catscan
  - publish: catscan-results.json
    artifact: catscan
    condition: always()
