# catscan on Codemagic (community-tested: no recorded run yet; docs/recipes/ci.md). Add the workflow to codemagic.yaml
# and replace:
#   1. `npm ci && npm run screenshots`: the step that makes your screenshots;
#   2. `shots`: the folder they land in, as shots/<locale>/<screen>.png;
#   3. `checks.yaml` (per-screen checks, docs/cli.md) and `locales` (your string catalogs, which name the locales).
# First green run without expectations: npx @catscan/cli@1.0.0 check shots --present "<text every screen shows>" --junit catscan.xml
# catscan needs Node 22 or newer on an Apple silicon Mac. The reports hold your screenshots' text: keep them short-lived.
workflows:
  catscan:
    name: catscan
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - node --version
      - npm ci && npm run screenshots
      # Only if you ship a locale catscan reads with Tesseract, such as el, he, hr or et (catscan languages lists them; the doctor line fails with the install command until this runs; install options: https://github.com/gatalifeltd/catscan/blob/main/docs/recipes/tesseract.md):
      # - brew install tesseract tesseract-lang
      - npx @catscan/cli@1.0.0 doctor --expect-locales-from locales
      - name: catscan check
        script: npx @catscan/cli@1.0.0 check shots --expect checks.yaml --expect-locales-from locales --junit catscan.xml --results catscan-results.json
        test_report: catscan.xml
    artifacts:
      - catscan.xml
      - catscan-results.json
