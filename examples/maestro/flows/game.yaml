# The game screen draws its text on a canvas with no accessibility labels: assertVisible cannot see it, catscan can.
appId: ${APP_ID}
---
- launchApp:
    arguments: { AppleLanguages: "(${LOCALE})", AppleLocale: "${LOCALE}" }   # iOS; Android sets the locale before the run
- tapOn: { id: "next" }
- tapOn: { id: "play" }
- extendedWaitUntil:
    visible: { id: "game" }
    timeout: 15000
- takeScreenshot: shots/${PLATFORM}/game.${LOCALE}
