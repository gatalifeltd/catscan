<!doctype html>
<!-- Spec 13 fixture: CSS truncation (ellipsis and a hard clip) in view and one cut line below the fold. ?fixed=1 lets every line fit. -->
<html><head><meta charset="utf-8"><title>truncation</title>
<style>
body{margin:24px;font:28px Helvetica, Arial, sans-serif;color:#111;background:#fff}
.row{white-space:nowrap;margin:16px 0}
.cut{width:220px;overflow:hidden;text-overflow:ellipsis}
.clip{width:200px;overflow:hidden}
.fixed .cut,.fixed .clip{width:auto}
.spacer{height:1600px}
</style></head>
<body>
<h1>Settings</h1>
<div id="box" style="width:600px;padding:8px">
  <div class="row cut">Notifications and privacy settings</div>
  <div class="row clip">Download everything offline</div>
</div>
<div class="spacer"></div>
<div class="row cut">Delete account and all saved games</div>
<script>if (new URLSearchParams(location.search).has("fixed")) document.body.classList.add("fixed");</script>
</body></html>
