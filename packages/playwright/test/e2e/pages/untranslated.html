<!doctype html>
<!-- Spec 13 fixture: a canvas raw key and an unfilled placeholder; ?english=1 draws the English title on a German screen. -->
<html><head><meta charset="utf-8"><title>untranslated</title>
<style>body{margin:0;background:#fff}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="400"></canvas>
<script>
const x = document.getElementById("c").getContext("2d");
x.fillStyle = "#fff"; x.fillRect(0, 0, 800, 400);
x.fillStyle = "#111"; x.font = "48px Helvetica, Arial, sans-serif";
const q = new URLSearchParams(location.search);
if (q.has("english")) { x.fillText("Spielen", 60, 100); x.fillText("Welcome home", 60, 200); }
else { x.fillText("Play", 60, 100); x.fillText("home.title", 60, 200); x.fillText("{count} coins", 60, 300); }
</script></body></html>
